name: リリース
description: develop から main への安定版リリースを追跡します。
title: "[Release] "
labels:
  - "type:release"
body:
  - type: textarea
    id: scope
    attributes:
      label: 対象範囲
      description: このリリースに含める実装 Issue を列挙してください。
    validations:
      required: true
  - type: textarea
    id: checks
    attributes:
      label: リリース確認
      placeholder: |
        - [ ] 対象の変更がすべて develop へマージされている
        - [ ] develop のパッケージアーティファクトをテストした
        - [ ] 破壊的変更と移行手順を文書化した
    validations:
      required: true
