name: 設計 / ADR
description: 実装前にアーキテクチャ上の決定または設計を記録します。
title: "[Design] "
labels:
  - "type:design"
body:
  - type: textarea
    id: context
    attributes:
      label: 背景と課題
    validations:
      required: true
  - type: textarea
    id: constraints
    attributes:
      label: 制約と互換性要件
    validations:
      required: true
  - type: textarea
    id: options
    attributes:
      label: 検討した選択肢
    validations:
      required: true
  - type: textarea
    id: decision
    attributes:
      label: 決定
      description: 設計が承認された時点で、この欄を更新してください。
    validations:
      required: true
  - type: textarea
    id: consequences
    attributes:
      label: 影響と後続 Issue
    validations:
      required: true
