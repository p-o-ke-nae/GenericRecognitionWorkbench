name: 機能追加または保守
description: 1 つの実装変更と、そのリリースへの影響を追跡します。
title: "[Change] "
body:
  - type: markdown
    attributes:
      value: この Issue の作成後に、semver ラベルを必ず 1 つだけ付けてください。
  - type: textarea
    id: design
    attributes:
      label: 関連する設計 Issue
      description: 元となる設計 Issue へのリンク、または設計 Issue が不要な理由を記載してください。
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: 必要な成果
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: 受け入れ条件
      placeholder: |
        - [ ] 確認可能な要件
        - [ ] テストまたは検証
    validations:
      required: true
  - type: dropdown
    id: compatibility
    attributes:
      label: 互換性への影響
      options:
        - 公開互換性への影響なし
        - 後方互換性のある公開 API の追加
        - 公開 API または永続化データの破壊的変更
    validations:
      required: true
