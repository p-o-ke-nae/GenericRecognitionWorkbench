name: Feature or maintenance
description: Track one implementation change and its release impact.
title: "[Change] "
body:
  - type: markdown
    attributes:
      value: Apply exactly one semver label after creating this Issue.
  - type: textarea
    id: design
    attributes:
      label: Related design Issue
      description: Link the source design Issue, or explain why one is unnecessary.
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Required outcome
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      placeholder: |
        - [ ] Observable requirement
        - [ ] Tests or validation
    validations:
      required: true
  - type: dropdown
    id: compatibility
    attributes:
      label: Compatibility impact
      options:
        - No public compatibility impact
        - Backward-compatible public API addition
        - Breaking public API or persisted-data change
    validations:
      required: true
